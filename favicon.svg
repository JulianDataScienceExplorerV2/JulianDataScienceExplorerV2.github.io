<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Tab-size favicon: bold version of favicon-detailed.svg so it stays readable at 16-32 px -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0F1115"/>
      <stop offset="100%" stop-color="#181B24"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFF3B0"/>
      <stop offset="35%" stop-color="#F7CE68"/>
      <stop offset="70%" stop-color="#E0A83E"/>
      <stop offset="100%" stop-color="#B87D18"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFFBE6" stop-opacity="1"/>
      <stop offset="35%" stop-color="#F7CE68" stop-opacity=".9"/>
      <stop offset="100%" stop-color="#E0A83E" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="core-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#F7CE68" stop-opacity=".55"/>
      <stop offset="100%" stop-color="#E0A83E" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <g transform="translate(256 262)">
    <circle r="150" fill="url(#core-glow)"/>
    <polygon points="0,-170 147.22,-85 147.22,85 0,170 -147.22,85 -147.22,-85"
             fill="none" stroke="url(#gold)" stroke-width="44" stroke-linejoin="round"/>
    <circle r="64" fill="url(#gold)"/>
    <circle r="27" fill="#0F1115"/>
    <circle cx="147.22" cy="-85" r="86" fill="url(#glow)"/>
    <circle cx="147.22" cy="-85" r="46" fill="#FFFBE6" stroke="#E0A83E" stroke-width="14"/>
  </g>
</svg>
